name: ci

# Runs deploy.yml's test job on every pull request, so a change is checked
# before it merges rather than only after it lands on main. Keep the steps in
# step with deploy.yml's test job.
#
# GitHub-hosted, not the self-hosted app-builder runner: this repository is
# public, so anyone can open a pull request, and the self-hosted runner sits on
# the staging machine with docker and a cluster-admin kubeconfig. Nothing here
# needs a secret, so pull requests from forks run too.

on:
  pull_request:

permissions:
  contents: read

concurrency:
  # A new push to the pull request supersedes the run for the previous one.
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'   # matches deploy.yml; no .nvmrc to read
          cache: npm
      - run: npm ci
      - run: npx tsc -b
      # The browser suite runs against staging after a deploy (e2e.yml); a
      # pull request can still catch it no longer compiling.
      - run: npx tsc -p e2e/tsconfig.json
      - run: npm test
      - run: npm run lint

  # The mocked browser suite (e2e/mock): the production build against a fake
  # backend, with screenshots in both themes. Runs in the pinned Playwright
  # image, the same one `npm run e2e:mock:update` makes the screenshots in,
  # because system fonts render differently everywhere else. Fake data only,
  # so the report is uploaded even from forks.
  browser:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    env:
      E2E_SNAPSHOTS: '1'
      PLAYWRIGHT_IMAGE_VERSION: 1.63.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: check @playwright/test matches the image
        run: |
          installed=$(node -p "require('@playwright/test/package.json').version")
          if [ "$installed" != "$PLAYWRIGHT_IMAGE_VERSION" ]; then
            echo "::error::@playwright/test is $installed but ci.yml runs the $PLAYWRIGHT_IMAGE_VERSION image. Move the image tag (and PLAYWRIGHT_IMAGE_VERSION) with the package, then run npm run e2e:mock:update."
            exit 1
          fi
      - run: npm run e2e:mock
      - name: keep the report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report-mock/
            test-results/mock/
          retention-days: 14
