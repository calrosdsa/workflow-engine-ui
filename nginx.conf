# Serves both Vite entry points: index.html (builder) and runtime.html
# (published apps). The routing below mirrors runtimeDevFallback() and
# BUILDER_ROUTE_PREFIXES in vite.config.ts - keep the three in sync.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # /api belongs to the edge proxy; answering it here with HTML would hide a routing mistake.
    location ^~ /api/ {
        return 404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /runtime.html {
        add_header Cache-Control "no-cache";
    }

    location ~ ^/(workflows|executions|forms|applications|knowledge-bases|team|portal|accept-invite|dev|test|login|account)(/|$) {
        try_files $uri /index.html;
    }

    # /{clientId}/{appId}, /{clientId}/{appId}/{menuSlug} and
    # /{clientId}/{appId}/{menuSlug}/{recordId} (a record opened from a menu).
    # Same shapes as src/lib/runtime-paths.ts; src/router-hosting.test.ts
    # checks every runtime route against both.
    # No {m,n} quantifiers: nginx reads a bare { as the start of a block.
    location ~ ^/[^/.]+/[^/.]+(/[^/.]+)?(/[^/.]+)?/?$ {
        try_files $uri /runtime.html;
    }

    # /{clientId}/{appId}/forms/{formId}/{recordId}
    location ~ ^/[^/.]+/[^/.]+/forms/[^/.]+/[^/.]+/?$ {
        try_files $uri /runtime.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
